<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tài khoản | Thuần Chay</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="account">

<div data-partial="header"></div>

<section class="page-hero" style="padding:44px 0;">
  <div class="container">
    <div class="breadcrumb"><a href="trang-chu.html">Trang chủ</a><span>/</span><span>Tài khoản</span></div>
    <h1 data-account-title>Đăng nhập</h1>
    <p data-account-subtitle>Quản lý đơn hàng và thông tin cá nhân của bạn.</p>
  </div>
</section>

<section class="section--tight">
  <div class="container" style="max-width:420px;">

    <div class="blog-tabs" data-account-tabs style="margin-bottom:32px;">
      <button class="blog-tab is-active" data-panel="login">Đăng nhập</button>
      <button class="blog-tab" data-panel="register">Đăng ký</button>
    </div>

    <!-- ---- Đăng nhập ---- -->
    <form class="contact-form" data-login-form data-account-panel="login">
      <div class="field"><label>Email *</label><input type="email" required></div>
      <div class="field"><label>Mật khẩu *</label><input type="password" required></div>
      <button class="btn btn-gold btn-block" type="submit">Đăng nhập</button>
    </form>

    <!-- ---- Đăng ký ---- -->
    <form class="contact-form" data-register-form data-account-panel="register" hidden>
      <div class="field"><label>Họ và tên *</label><input type="text" required></div>
      <div class="field"><label>Email *</label><input type="email" required></div>
      <div class="field"><label>Mật khẩu *</label><input type="password" required minlength="6"></div>
      <div class="field"><label>Nhập lại mật khẩu *</label><input type="password" required minlength="6"></div>
      <button class="btn btn-gold btn-block" type="submit">Đăng ký</button>
    </form>

    <!-- ---- Nhập mã kích hoạt ---- -->
    <form class="contact-form" data-verify-form data-account-panel="verify" hidden>
      <p style="font-size:14.5px; color:var(--charcoal-soft);">
        Mã kích hoạt gồm 6 chữ số đã được gửi tới <b data-verify-email style="color:var(--ink);"></b>.
      </p>
      <div class="badge-pill" data-verify-demo-code style="display:flex; width:100%; justify-content:center; font-size:20px; letter-spacing:0.3em; padding:14px; color:var(--ink); box-sizing:border-box;"></div>
      <div class="field"><label>Mã kích hoạt *</label><input type="text" inputmode="numeric" maxlength="6" required placeholder="Nhập 6 chữ số"></div>
      <button class="btn btn-gold btn-block" type="submit">Kích hoạt tài khoản</button>
      <p style="text-align:center; font-size:14px; color:var(--charcoal-soft);">Không nhận được mã? <a href="#" data-resend-code style="color:var(--sage-dark); font-weight:700;">Gửi lại mã</a></p>
    </form>

  </div>
</section>

<div data-partial="footer"></div>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
</body>
</html>
