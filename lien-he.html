<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liên hệ | Thuần Chay</title>
<meta name="description" content="Liên hệ với Thuần Chay để được tư vấn sản phẩm thuần thực vật, đặt hàng hoặc hợp tác.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact">

<div data-partial="header"></div>

<section class="page-hero">
  <div class="container">
    <div class="breadcrumb"><a href="trang-chu.html">Trang chủ</a><span>/</span><span>Liên hệ</span></div>
    <h1>Liên hệ với Thuần Chay</h1>
    <p>Đội ngũ tư vấn của chúng tôi sẵn sàng hỗ trợ bạn 24/7.</p>
  </div>
</section>

<section class="section">
  <div class="container">
    <div class="contact-layout">
      <form class="contact-form" data-contact-form>
        <div class="field">
          <label for="name">Họ và tên *</label>
          <input id="name" type="text" required placeholder="Nguyễn Văn A">
        </div>
        <div class="field">
          <label for="phone">Số điện thoại *</label>
          <input id="phone" type="tel" required pattern="[0-9]{9,11}" placeholder="09xxxxxxxx">
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="ban@email.com">
        </div>
        <div class="field">
          <label for="message">Nội dung *</label>
          <textarea id="message" rows="5" required placeholder="Bạn cần tư vấn về sản phẩm nào?"></textarea>
        </div>
        <button class="btn btn-gold btn-block" type="submit">Gửi liên hệ</button>
      </form>

      <div>
        <div class="contact-info-card">
          <h3>Thông tin liên hệ</h3>
          <div class="contact-info-row">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 10c0 6-9 12-9 12S3 16 3 10a9 9 0 1 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            <div><b>Showroom</b><span>Số 58, Đường số 3, KDC Cityland Parkhill, P. Gò Vấp, TP. Hồ Chí Minh</span></div>
          </div>
          <div class="contact-info-row">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.9.7 2.7a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.4-1.4a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.8 2z"/></svg>
            <div><b>Hotline</b><span>0902 354 902 · 0931 864 989</span></div>
          </div>
          <div class="contact-info-row">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h16v16H4z"/><path d="m4 6 8 7 8-7"/></svg>
            <div><b>Email</b><span>hello@thuanchay.vn</span></div>
          </div>
          <div class="contact-info-row">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
            <div><b>Giờ làm việc</b><span>Thứ 2 – Thứ 6: 8h30 – 17h30</span></div>
          </div>
        </div>
        <div class="map-embed">
          <iframe title="Bản đồ Thuần Chay" width="100%" height="100%" style="border:0;" loading="lazy"
            src="https://www.google.com/maps?q=Cityland+Parkhill+Go+Vap+Ho+Chi+Minh&output=embed"></iframe>
        </div>
      </div>
    </div>
  </div>
</section>

<div data-partial="footer"></div>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
</body>
</html>
